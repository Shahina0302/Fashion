<!DOCTYPE html>
<html>
<head>
<title>Contact Us | Fashionista</title>
<style>

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}

body {

    font-family: Arial, sans-serif;

    background: #f5eee6;

    color: #30251f;

}

nav {

    background: #211c1a;

    padding: 22px 7%;

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.logo {

    color: #d5ad7c;

    font-size: 27px;

    font-weight: bold;

    letter-spacing: 3px;

}

nav a {

    color: white;

    text-decoration: none;

    margin-left: 18px;

}

.heading {

    text-align: center;

    padding: 40px 15px;

}

.heading h1 {

    color: #9b704c;

    font-size: 40px;

}

.heading p {

    margin-top: 12px;

}

.contact {

    width: 80%;

    max-width: 650px;

    margin: 20px auto 50px;

    background: white;

    padding: 35px;

    border-radius: 12px;

    box-shadow: 0 5px 15px #c9b9a8;

}

.contact h2 {

    text-align: center;

    color: #9b704c;

    margin-bottom: 25px;

}

input, textarea {

    width: 100%;

    padding: 13px;

    margin-bottom: 18px;

    border: 1px solid #c9b9a8;

    border-radius: 5px;

    font-size: 15px;

}

textarea {

    height: 120px;

}

button {

    width: 100%;

    padding: 14px;

    background: #9b704c;

    color: white;

    border: none;

    font-size: 16px;

    cursor: pointer;

}

.quote {

    text-align: center;

    padding: 30px 15px 50px;

    color: #9b704c;

}

.quote h2 {

    font-style: italic;

    font-size: 25px;

}

footer {

    background: #211c1a;

    color: white;

    text-align: center;

    padding: 20px;

}
</style>
</head>
<body>
<nav>
<div class="logo">FASHIONISTA</div>
<div>

<a href="page5.html">Contact</a>
</div>
</nav>
<div class="heading">
<h1>CONTACT US</h1>
<p>We Would Love to Hear From You!</p>
</div>
<div class="contact">
<h2>Get In Touch</h2>
<form onsubmit="alert('Thank you for contacting Fashionista!'); return false;">
<input type="text"

        placeholder="Enter Your Name" required>
<input type="email"

        placeholder="Enter Your Email" required>
<input type="text"

        placeholder="Enter Your Subject" required>
<textarea placeholder="Write Your Message"

        required></textarea>
<button type="submit">

        SEND MESSAGE
</button>
</form>
</div>
<div class="quote">
<h2>"Fashion is the art of expressing yourself."</h2>
<p>Discover Your Style. Create Your Identity.</p>
</div>
<footer>

    ©️ 2026 Fashionista | Fashion Industry Project
<p>Thank You For Visiting Our Website!</p>
</footer>
</body>
</html>
